<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e1b"/>
      <stop offset="50%" stop-color="#0d1412"/>
      <stop offset="100%" stop-color="#080c0b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="260" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="86" y="106" width="340" height="320" rx="36" fill="#18221e" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="86" y="106" width="340" height="320" rx="36" fill="url(#glassGrad)"/>
    <path d="M 86 142 C 86 122 102 106 122 106 L 390 106 C 410 106 426 122 426 142 L 426 186 L 86 186 Z" fill="url(#primaryGrad)"/>
    
    <g fill="#f5f5f5" opacity="0.95">
      <rect x="156" y="80" width="20" height="52" rx="10" filter="url(#shadow)"/>
      <rect x="246" y="80" width="20" height="52" rx="10" filter="url(#shadow)"/>
      <rect x="336" y="80" width="20" height="52" rx="10" filter="url(#shadow)"/>
    </g>

    <g fill="rgba(255,255,255,0.15)">
      <circle cx="150" cy="240" r="16"/>
      <circle cx="210" cy="240" r="16"/>
      <circle cx="270" cy="240" r="16"/>
      <circle cx="330" cy="240" r="16"/>
      <circle cx="390" cy="240" r="16" fill="url(#accentGrad)" opacity="0.9"/>

      <circle cx="150" cy="300" r="16"/>
      <rect x="194" y="284" width="92" height="32" rx="16" fill="url(#primaryGrad)" opacity="0.9"/>
      <circle cx="330" cy="300" r="16"/>
      <circle cx="390" cy="300" r="16"/>

      <circle cx="150" cy="360" r="16"/>
      <circle cx="210" cy="360" r="16"/>
      <circle cx="270" cy="360" r="16"/>
      <circle cx="330" cy="360" r="16" fill="#34d399" opacity="0.9"/>
      <circle cx="390" cy="360" r="16"/>
    </g>

    <g transform="translate(240, 290)">
      <path d="M-6 2 L-1 7 L9 -3" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <path d="M 400 70 Q 400 95 425 95 Q 400 95 400 120 Q 400 95 375 95 Q 400 95 400 70 Z" fill="#34d399" filter="url(#glow)"/>
</svg>
